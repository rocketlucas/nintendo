<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario World - Portable SNES</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 10px;
            background: #1b1b1b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Moldura do Console */
        .console-body {
            background: #ffffff;
            border: 3px solid #111;
            border-radius: 25px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Área da Tela */
        .screen-container {
            width: 100%;
            background: #cbd2d9;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        #game {
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Botões Select e Start */
        .middle-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .pill-btn {
            width: 55px;
            height: 18px;
            background: #7b8794;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3);
        }

        .pill-btn:active {
            transform: scale(0.95);
            background: #616e7c;
        }

        /* Painel de Controles da Base */
        .controls-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        /* D-Pad (Direcional) */
        .dpad-container {
            width: 120px;
            height: 120px;
            background: #f0f4f8;
            border: 2px solid #cbd2d9;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dpad {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .dpad-btn {
            position: absolute;
            background: #cbd2d9;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #616e7c;
            font-size: 14px;
        }

        .dpad-btn:active {
            background: #9aa5b1;
        }

        .dpad-up { top: 0; left: 30px; width: 30px; height: 35px; border-radius: 5px 5px 0 0; }
        .dpad-down { bottom: 0; left: 30px; width: 30px; height: 35px; border-radius: 0 0 5px 5px; }
        .dpad-left { top: 30px; left: 0; width: 35px; height: 30px; border-radius: 5px 0 0 5px; }
        .dpad-right { top: 30px; right: 0; width: 35px; height: 30px; border-radius: 0 5px 5px 0; }
        .dpad-center { top: 30px; left: 30px; width: 30px; height: 30px; background: #cbd2d9; }

        /* Botões de Ação ABXY */
        .action-container {
            width: 130px;
            height: 130px;
            background: #cbd2d9;
            border-radius: 65px;
            transform: rotate(-35deg);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }

        .btn-action {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .btn-action:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .btn-blue { background: #0000ff; grid-column: 1; grid-row: 1; }
        .btn-green { background: #00a843; grid-column: 1; grid-row: 2; }
        .btn-red { background: #ff0000; grid-column: 2; grid-row: 1; }
        .btn-yellow { background: #ffd700; grid-column: 2; grid-row: 2; }
    </style>
</head>
<body>

    <div class="console-body">
        <!-- Área da Tela do Jogo -->
        <div class="screen-container">
            <div id="game"></div>
        </div>

        <!-- Botões Select e Start -->
        <div class="middle-buttons">
            <button class="pill-btn" data-key="Shift"></button>
            <button class="pill-btn" data-key="Enter"></button>
        </div>

        <!-- Painel de Controles -->
        <div class="controls-panel">
            <!-- Direcionais (D-Pad) -->
            <div class="dpad-container">
                <div class="dpad">
                    <button class="dpad-btn dpad-up" data-key="ArrowUp">▲</button>
                    <button class="dpad-btn dpad-down" data-key="ArrowDown">▼</button>
                    <button class="dpad-btn dpad-left" data-key="ArrowLeft">◄</button>
                    <button class="dpad-btn dpad-right" data-key="ArrowRight">►</button>
                    <div class="dpad-center"></div>
                </div>
            </div>

            <!-- Botões A B X Y -->
            <div class="action-container">
                <button class="btn-action btn-blue" data-key="x"></button>
                <button class="btn-action btn-green" data-key="z"></button>
                <button class="btn-action btn-red" data-key="a"></button>
                <button class="btn-action btn-yellow" data-key="s"></button>
            </div>
        </div>
    </div>

    <!-- Configuração do EmuladorJS -->
    <script>
        EJS_player = '#game';
        EJS_core = 'snes';
        EJS_gameUrl = 'roms/Super Mario World (USA).sfc';
        EJS_gameName = 'Super Mario World';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_startOnLoaded = true;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

    <!-- Mapeamento de Toque dos Botões Físicos da Tela -->
    <script>
        function simulateKeyEvent(type, key) {
            const event = new KeyboardEvent(type, {
                key: key,
                bubbles: true,
                cancelable: true
            });
            document.dispatchEvent(event);
        }

        const buttons = document.querySelectorAll('[data-key]');
        
        buttons.forEach(button => {
            const key = button.getAttribute('data-key');

            // Eventos para Dispositivos Mobile (Touch)
            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                simulateKeyEvent('keydown', key);
            });

            button.addEventListener('touchend', (e) => {
                e.preventDefault();
                simulateKeyEvent('keyup', key);
            });

            // Suporte adicional para clique de Mouse
            button.addEventListener('mousedown', () => simulateKeyEvent('keydown', key));
            button.addEventListener('mouseup', () => simulateKeyEvent('keyup', key));
        });
    </script>
</body>
</html>
