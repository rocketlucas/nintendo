<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario World - Portable SNES</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 10px;
            background: #1b1b1b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Moldura do Console */
        .console-body {
            background: #ffffff;
            border: 3px solid #111;
            border-radius: 25px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Área da Tela */
        .screen-container {
            width: 100%;
            background: #cbd2d9;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        #game {
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Botões Select e Start visuais da carcaça */
        .middle-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .pill-btn {
            width: 55px;
            height: 18px;
            background: #7b8794;
            border-radius: 10px;
            border: none;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3);
        }

        /* Painel de Controles da Base */
        .controls-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            min-height: 130px;
        }

        /* Desenho do D-Pad na carcaça */
        .dpad-container {
            width: 120px;
            height: 120px;
            background: #f0f4f8;
            border: 2px solid #cbd2d9;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dpad {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .dpad-part {
            position: absolute;
            background: #cbd2d9;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #616e7c;
            font-size: 14px;
        }

        .dpad-up { top: 0; left: 30px; width: 30px; height: 35px; border-radius: 5px 5px 0 0; }
        .dpad-down { bottom: 0; left: 30px; width: 30px; height: 35px; border-radius: 0 0 5px 5px; }
        .dpad-left { top: 30px; left: 0; width: 35px; height: 30px; border-radius: 5px 0 0 5px; }
        .dpad-right { top: 30px; right: 0; width: 35px; height: 30px; border-radius: 0 5px 5px 0; }
        .dpad-center { top: 30px; left: 30px; width: 30px; height: 30px; background: #cbd2d9; }

        /* Desenho dos Botões ABXY na carcaça */
        .action-container {
            width: 130px;
            height: 130px;
            background: #cbd2d9;
            border-radius: 65px;
            transform: rotate(-35deg);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }

        .btn-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .btn-blue { background: #0000ff; grid-column: 1; grid-row: 1; }
        .btn-green { background: #00a843; grid-column: 1; grid-row: 2; }
        .btn-red { background: #ff0000; grid-column: 2; grid-row: 1; }
        .btn-yellow { background: #ffd700; grid-column: 2; grid-row: 2; }
    </style>
</head>
<body>

    <div class="console-body">
        <!-- Área da Tela do Jogo -->
        <div class="screen-container">
            <div id="game"></div>
        </div>

        <!-- Botões Select e Start -->
        <div class="middle-buttons">
            <div class="pill-btn"></div>
            <div class="pill-btn"></div>
        </div>

        <!-- Desenho da base do controle -->
        <div class="controls-panel">
            <div class="dpad-container">
                <div class="dpad">
                    <div class="dpad-part dpad-up">▲</div>
                    <div class="dpad-part dpad-down">▼</div>
                    <div class="dpad-part dpad-left">◄</div>
                    <div class="dpad-part dpad-right">►</div>
                    <div class="dpad-center"></div>
                </div>
            </div>

            <div class="action-container">
                <div class="btn-circle btn-blue"></div>
                <div class="btn-circle btn-green"></div>
                <div class="btn-circle btn-red"></div>
                <div class="btn-circle btn-yellow"></div>
            </div>
        </div>
    </div>

    <!-- Configuração do EmulatorJS habilitando os controles móveis nativos -->
    <script>
        EJS_player = '#game';
        EJS_core = 'snes';
        EJS_gameUrl = 'roms/Super Mario World (USA).sfc';
        EJS_gameName = 'Super Mario World';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_startOnLoaded = true;
        
        // Ativa os controles touch nativos do emulador dentro do iframe
        EJS_VirtualGamepadSettings = true;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
